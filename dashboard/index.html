<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NR TICKET</title>

    <link rel="stylesheet" href="/dashboard/css/style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #05060a;
            color: white;
        }

        /* FONDO */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -5;
            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(88, 101, 242, 0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(124, 58, 237, 0.12),
                    transparent 30%
                ),
                #05060a;
        }

        /* BRILLOS */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            animation: moveGlow 12s ease-in-out infinite alternate;
        }

        .glow.one {
            top: -200px;
            left: -150px;
            background: #5865f2;
        }

        .glow.two {
            right: -200px;
            bottom: -200px;
            background: #7c3aed;
            animation-delay: 3s;
        }

        @keyframes moveGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(100px, 70px) scale(1.15);
            }

            100% {
                transform: translate(-50px, -50px) scale(0.95);
            }
        }

        /* PARTÍCULAS */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: float linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            to {
                transform: translateY(-10vh);
                opacity: 0;
            }
        }

        /* CUADRÍCULA */
        .grid {
            position: absolute;
            inset: 0;
            opacity: 0.12;
            background-image:
                linear-gradient(
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.04) 1px,
                    transparent 1px
                );
            background-size: 50px 50px;
            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );
        }

        /* CONTENEDOR */
        .welcome {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        /* TARJETA */
        .welcome-card {
            width: min(520px, 100%);
            padding: 50px 40px;
            text-align: center;

            background: rgba(10, 11, 18, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 28px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px rgba(255,255,255,0.08);

            animation: cardAppear 0.9s ease forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* LOGO */
        .logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 42px;

            border-radius: 24px;

            background:
                linear-gradient(
                    135deg,
                    rgba(88,101,242,0.35),
                    rgba(124,58,237,0.25)
                );

            border: 1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 0 40px rgba(88,101,242,0.25);

            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* TITULO */
        h1 {
            font-size: 42px;
            letter-spacing: -1px;
            margin-bottom: 12px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #aeb6ff,
                #ffffff
            );

            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            animation: titleShine 4s linear infinite;
        }

        @keyframes titleShine {
            to {
                background-position: 200% center;
            }
        }

        .subtitle {
            font-size: 17px;
            color: #b7b9c8;
            margin-bottom: 16px;
        }

        .description {
            max-width: 390px;
            margin: auto;
            line-height: 1.6;
            color: #858899;
            font-size: 14px;
        }

        /* BOTONES */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 32px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 52px;
            padding: 0 20px;

            border-radius: 14px;

            text-decoration: none;
            font-weight: 600;
            font-size: 15px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .button.primary {
            color: white;
            background: linear-gradient(
                135deg,
                #5865f2,
                #4752c4
            );

            box-shadow:
                0 10px 30px rgba(88,101,242,0.25);
        }

        .button.primary:hover {
            box-shadow:
                0 15px 40px rgba(88,101,242,0.40);
        }

        .button.secondary {
            color: #d8d9e3;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .button.secondary:hover {
            background: rgba(255,255,255,0.09);
        }

        /* MÓVIL */
        @media (max-width: 600px) {

            .welcome-card {
                padding: 40px 25px;
                border-radius: 22px;
            }

            h1 {
                font-size: 34px;
            }

            .logo {
                width: 75px;
                height: 75px;
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- FONDO ANIMADO -->
    <div class="background">

        <div class="glow one"></div>
        <div class="glow two"></div>

        <div class="grid"></div>

        <div class="particles">

            <span class="particle" style="left:5%; animation-duration:14s;"></span>
            <span class="particle" style="left:12%; animation-duration:18s; animation-delay:2s;"></span>
            <span class="particle" style="left:20%; animation-duration:13s; animation-delay:5s;"></span>
            <span class="particle" style="left:28%; animation-duration:20s; animation-delay:1s;"></span>
            <span class="particle" style="left:36%; animation-duration:16s; animation-delay:4s;"></span>
            <span class="particle" style="left:44%; animation-duration:19s; animation-delay:3s;"></span>
            <span class="particle" style="left:52%; animation-duration:15s; animation-delay:6s;"></span>
            <span class="particle" style="left:60%; animation-duration:21s; animation-delay:2s;"></span>
            <span class="particle" style="left:68%; animation-duration:17s; animation-delay:7s;"></span>
            <span class="particle" style="left:76%; animation-duration:14s; animation-delay:4s;"></span>
            <span class="particle" style="left:84%; animation-duration:19s; animation-delay:1s;"></span>
            <span class="particle" style="left:92%; animation-duration:16s; animation-delay:5s;"></span>

        </div>

    </div>

    <!-- CONTENIDO -->
    <main class="welcome">

        <section class="welcome-card">

            <div class="logo">
                👑
            </div>

            <h1>NR TICKET</h1>

            <p class="subtitle">
                Sistema avanzado de tickets para Discord
            </p>

            <p class="description">
                Administra tus servidores, crea paneles de soporte
                y gestiona tus tickets desde un solo lugar.
            </p>

            <div class="actions">

                <a href="/auth/discord" class="button primary">
                    🔐 Iniciar sesión con Discord
                </a>

                <a href="/soporte" class="button secondary">
                    🛟 Soporte
                </a>

            </div>

        </section>

    </main>

</body>
</html>
